<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BANK MINI SMK WALISONGO JAKARTA</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6f3;--card:#fff;--tx:#1d2a20;--mut:#6a776d;--pri:#1f7a4d;--pri2:#e3f2ea;--bd:#dfe5df;--red:#c0392b;--amb:#b9770e}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a15;--card:#1a251e;--tx:#e8efe9;--mut:#93a396;--pri:#4cc387;--pri2:#21352a;--bd:#2c3b31;--red:#ee7b6e;--amb:#e8b04a}}
:root[data-theme="dark"]{--bg:#121a15;--card:#1a251e;--tx:#e8efe9;--mut:#93a396;--pri:#4cc387;--pri2:#21352a;--bd:#2c3b31;--red:#ee7b6e;--amb:#e8b04a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--card);border-bottom:1px solid var(--bd)}
.logo{width:52px;height:52px;object-fit:contain;border-radius:8px;flex:none}
h1{font-size:18px;margin:0;line-height:1.25}h1 small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.badge{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--pri2);color:var(--pri);font-weight:600}
nav{display:flex;gap:6px;padding:10px 18px;overflow-x:auto}
nav button{white-space:nowrap}
main{max-width:1000px;margin:0 auto;padding:6px 18px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
h2{font-size:16px;margin:0 0 12px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.grid2{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.stat{background:var(--pri2);border-radius:10px;padding:12px}.stat span{font-size:12px;color:var(--mut)}.stat b{display:block;font-size:18px}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:3px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
button.on,button.p{background:var(--pri);color:#fff;border-color:var(--pri)}
button.d{color:var(--red);padding:3px 8px;font-size:12px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mut);font-weight:600;font-size:12px}
.in{color:var(--pri);font-weight:600}.out{color:var(--red);font-weight:600}.r{text-align:right}
.msg{padding:9px 12px;border-radius:8px;margin-top:10px;font-size:13px;background:var(--pri2);color:var(--pri)}.msg.e{background:rgba(192,57,43,.14);color:var(--red)}
.hide{display:none}.mut{color:var(--mut);font-size:13px}
#lg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}
#lg .card{width:100%;max-width:340px;margin:0}
#lg.hide{display:none}
#lg{z-index:50}.badge{white-space:normal}
.card{border-radius:14px}
.app{display:flex;min-height:100vh}
.side{width:240px;flex:none;background:var(--card);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:16px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 6px 18px}.brand img{width:46px;height:46px;border-radius:8px;object-fit:contain;flex:none}.brand b{display:block;font-size:15px;line-height:1.2}.brand span{display:block;font-size:11px;color:var(--mut);line-height:1.25}
.side nav{display:flex;flex-direction:column;gap:4px;padding:0;flex:1;overflow:visible}
.side nav button{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:none;padding:11px 12px;border-radius:10px;color:var(--mut);font-weight:500}
.side nav button:hover{background:var(--pri2);color:var(--tx)}.side nav button.on{background:var(--pri);color:#fff}
.me{border-top:1px solid var(--bd);padding-top:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}.me button{width:100%}
.mn{flex:1;min-width:0}.top{display:none}.ov{display:none}
main{max-width:1060px;margin:0 auto;padding:22px 24px 48px}
.hero{background:linear-gradient(135deg,#1f7a4d,#12503a);color:#fff;border-radius:18px;padding:22px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;margin-bottom:14px}
.hero h2{font-size:21px;margin:0 0 4px}.hero p{margin:0;opacity:.85;font-size:14px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
button.big{padding:12px 20px;border-radius:12px;font-weight:600;background:#fff;color:#14573a;border:0}
button.big.alt{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.4)}
.sg{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.sc{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center}
.sc i{font-style:normal;font-size:20px;width:44px;height:44px;border-radius:12px;background:var(--pri2);display:grid;place-items:center;flex:none}
.sc span{font-size:12px;color:var(--mut);display:block}.sc b{font-size:17px}
.cols{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.cols .card{margin:0}
.bi{margin-bottom:14px}.bi .t{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.bar{height:8px;background:var(--pri2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);border-radius:9px}
#md{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:14px;z-index:40}
#md.show{display:flex}#md .card{width:100%;max-width:540px;max-height:90vh;overflow-y:auto;margin:0}
#tst{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1f7a4d;color:#fff;padding:10px 18px;border-radius:99px;z-index:60;display:none;font-size:14px;max-width:90vw}
@media(max-width:820px){.side{position:fixed;left:0;top:0;bottom:0;height:auto;z-index:30;transform:translateX(-100%);transition:transform .2s;padding-top:calc(16px + env(safe-area-inset-top,0px))}.side.open{transform:none}.ov.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25}.top{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:10}main{padding:16px 14px 40px}.hero{padding:18px}}
@media print{.side,.top{display:none}}
.svc{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.svb{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 10px;border-radius:14px;background:var(--bg);border:1px solid var(--bd);font-weight:600;text-align:center}
.svb i{font-style:normal;font-size:28px;width:56px;height:56px;display:grid;place-items:center;border-radius:16px;background:var(--pri2)}.svb:hover{border-color:var(--pri)}
.credit{text-align:center;padding:14px 12px 22px;font-size:12px;color:var(--mut,#6b7280);opacity:.85}.credit b{font-weight:600}@media print{.credit{display:none}}
</style>
</head>

  '<div class="card"><h2>Daftar Siswa ('+l.length+')</h2><div style="max-width:240px"><label>Filter kelas</label><select onchange="sf=this.value;render()">'+opts(kelasList(),sf,'Semua kelas')+'</select></div><br>'+siswaTbl(l,true)+'</div>';
}
function addNames(names,k){var have={},n=0,d=0;db.siswa.forEach(function(x){if(x.kelas===k)have[x.nama.toLowerCase()]=1});
  names.forEach(function(nm){nm=String(nm==null?'':nm).replace(/\s+/g,' ').trim();if(!nm)return;if(have[nm.toLowerCase()]){d++;return}have[nm.toLowerCase()]=1;db.siswa.push({id:uid(),nama:nm,kelas:k});n++});
  if(n&&db.kelas.indexOf(k)<0)db.kelas.push(k);return[n,d]}
function openManual(){if(!kelasList().length)return amsg('Tambahkan kelas terlebih dahulu di menu Masukan Kelas.',1);openModal('<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><h2 style="margin:0">Tambah Manual</h2><button onclick="closeModal()" aria-label="Tutup">✕</button></div><label>Kelas</label>'+esel('m_k',lk)+'<br><br><label>Nama siswa (satu nama per baris)</label><textarea id="m_n" rows="6" placeholder="Budi Santoso&#10;Siti Aminah"></textarea><div id="mm"></div><br><button class="p" onclick="addSiswa()">Tambahkan</button> <button onclick="closeModal()">Batal</button>')}
function addSiswa(){var k=$('m_k').value,n=$('m_n').value.split('\n');
  if(!k||!n.join('').trim()){$('mm').innerHTML='<div class="msg e">Pilih kelas dan isi minimal satu nama.</div>';return}
  lk=k;var r=addNames(n,k);save();closeModal();amsg(r[0]+' siswa ditambahkan ke kelas '+esc(k)+(r[1]?'. '+r[1]+' nama sudah ada dan dilewati.':'.'),0,1)}
function parseCsv(t){return t.replace(/^\ufeff/,'').split(/\r?\n/).map(function(l){return l.split(/[;,\t]/).map(function(c){return c.replace(/^"|"$/g,'').trim()})})}
function doImport(){
  var k=$('i_k').value,f=$('i_f').files[0],o=$('i_o').value,n=$('i_n').value.trim();
  if(!k)return amsg('Pilih kelas tujuan terlebih dahulu.',1);
  if(!f)return amsg('Pilih file Excel atau CSV terlebih dahulu.',1);
  lk=k;var by=o+(n?' - '+n:''),rd=new FileReader(),csv=/\.csv$/i.test(f.name);
  if(!csv&&!window.XLSX)return amsg('Pembaca Excel belum termuat (perlu internet). Simpan file sebagai CSV lalu import ulang.',1);
  rd.onerror=function(){amsg('File tidak dapat dibaca.',1)};
  rd.onload=function(){var rows;try{rows=csv?parseCsv(rd.result):XLSX.utils.sheet_to_json(XLSX.read(rd.result,{type:'array'}).Sheets[XLSX.read(rd.result,{type:'array'}).SheetNames[0]],{header:1,defval:''})}catch(e){return amsg('File tidak valid atau rusak.',1)}finImp(rows,k,by,f.name)};
  if(csv)rd.readAsText(f);else rd.readAsArrayBuffer(f);
}
function finImp(rows,k,by,fn){
  var ci=-1,s0=0,i,names=[];
  for(i=0;i<Math.min(rows.length,10);i++){var j=rows[i].findIndex(function(c){return /nama/i.test(String(c))});if(j>=0){ci=j;s0=i+1;break}}
  if(ci<0)ci=(rows[0]&&rows[0].length>1)?1:0;
  for(i=s0;i<rows.length;i++){var nm=String(rows[i][ci]==null?'':rows[i][ci]).trim();if(!nm||/^contoh/i.test(nm)||/^\d+$/.test(nm))continue;names.push(nm)}
  if(!names.length)return amsg('Tidak ada nama siswa ditemukan. Pastikan nama diisi di kolom Nama Siswa.',1);
  var r=addNames(names,k);db.imp.push({ts:Date.now(),tgl:today(),kelas:k,oleh:by,jml:r[0],file:fn});save();
  amsg('Import selesai: '+r[0]+' siswa ditambahkan ke kelas '+esc(k)+' oleh '+esc(by)+(r[1]?'. '+r[1]+' nama sudah ada dan dilewati.':'.'),0,1)}
function tplDl(){
  var rows=[['No','Nama Siswa'],[1,'Contoh: Budi Santoso (hapus baris ini)']];
  if(window.XLSX){var ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=[{wch:6},{wch:42}];var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Data Siswa');XLSX.writeFile(wb,'template-data-siswa.xlsx')}
  else{var a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(function(r){return r.join(',')}).join('\n')],{type:'text/csv'}));a.download='template-data-siswa.csv';a.click()}}

function delSiswa(id){var s=sis(id);if(!confirm('Hapus '+s.nama+'? Riwayat transaksi siswa ini juga ikut dihapus.'))return;db.siswa=db.siswa.filter(function(x){return x.id!==id});db.trx=db.trx.filter(function(t){return t.sid!==id});save();render()}
function vLaporan(){var l=filt(),m=0,k=0;l.forEach(function(t){if(t.jenis==='setor'||t.jenis==='masuk')m+=t.jml;else k+=t.jml});
  return '<div class="card"><h2>Laporan</h2>'+fbar()+'<br><div class="grid"><div class="stat"><span>Total Masuk</span><b>'+rp(m)+'</b></div><div class="stat"><span>Total Keluar</span><b>'+rp(k)+'</b></div><div class="stat"><span>Selisih</span><b>'+rp(m-k)+'</b></div></div><br><button class="p" onclick="csv()">Unduh CSV</button> <button onclick="window.print()">Cetak</button><br><br>'+tbl(l,false)+'</div>'}
function csv(){var rows=[['Tanggal','Jenis','Siswa','Kelas','Kategori','Keterangan','Jumlah','Petugas']].concat(filt().map(function(t){var s=sis(t.sid);return [t.tgl,JN[t.jenis],s?s.nama:'',s?s.kelas:'',t.kat,t.ket,t.jml,t.pet]}));
  var c=rows.map(function(r){return r.map(function(x){return '"'+String(x).replace(/"/g,'""')+'"'}).join(',')}).join('\n');
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+c],{type:'text/csv'}));a.download='laporan-koperasi.csv';a.click()}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal()});
$('v').innerHTML='<p class="mut">Memuat data...</p>';
boot();
</script>
