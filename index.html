<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BANK MINI SMK WALISONGO JAKARTA</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6f3;--card:#fff;--tx:#1d2a20;--mut:#6a776d;--pri:#1f7a4d;--pri2:#e3f2ea;--bd:#dfe5df;--red:#c0392b;--amb:#b9770e}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a15;--card:#1a251e;--tx:#e8efe9;--mut:#93a396;--pri:#4cc387;--pri2:#21352a;--bd:#2c3b31;--red:#ee7b6e;--amb:#e8b04a}}
:root[data-theme="dark"]{--bg:#121a15;--card:#1a251e;--tx:#e8efe9;--mut:#93a396;--pri:#4cc387;--pri2:#21352a;--bd:#2c3b31;--red:#ee7b6e;--amb:#e8b04a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--card);border-bottom:1px solid var(--bd)}
.logo{width:52px;height:52px;object-fit:contain;border-radius:8px;flex:none}
h1{font-size:18px;margin:0;line-height:1.25}h1 small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.badge{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--pri2);color:var(--pri);font-weight:600}
nav{display:flex;gap:6px;padding:10px 18px;overflow-x:auto}
nav button{white-space:nowrap}
main{max-width:1000px;margin:0 auto;padding:6px 18px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
h2{font-size:16px;margin:0 0 12px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.grid2{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.stat{background:var(--pri2);border-radius:10px;padding:12px}.stat span{font-size:12px;color:var(--mut)}.stat b{display:block;font-size:18px}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:3px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
button.on,button.p{background:var(--pri);color:#fff;border-color:var(--pri)}
button.d{color:var(--red);padding:3px 8px;font-size:12px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mut);font-weight:600;font-size:12px}
.in{color:var(--pri);font-weight:600}.out{color:var(--red);font-weight:600}.r{text-align:right}
.msg{padding:9px 12px;border-radius:8px;margin-top:10px;font-size:13px;background:var(--pri2);color:var(--pri)}.msg.e{background:rgba(192,57,43,.14);color:var(--red)}
.hide{display:none}.mut{color:var(--mut);font-size:13px}
#lg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}
#lg .card{width:100%;max-width:340px;margin:0}
#lg.hide{display:none}
#lg{z-index:50}.badge{white-space:normal}
.card{border-radius:14px}
.app{display:flex;min-height:100vh}
.side{width:240px;flex:none;background:var(--card);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:16px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 6px 18px}.brand img{width:46px;height:46px;border-radius:8px;object-fit:contain;flex:none}.brand b{display:block;font-size:15px;line-height:1.2}.brand span{display:block;font-size:11px;color:var(--mut);line-height:1.25}
.side nav{display:flex;flex-direction:column;gap:4px;padding:0;flex:1;overflow:visible}
.side nav button{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:none;padding:11px 12px;border-radius:10px;color:var(--mut);font-weight:500}
.side nav button:hover{background:var(--pri2);color:var(--tx)}.side nav button.on{background:var(--pri);color:#fff}
.me{border-top:1px solid var(--bd);padding-top:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}.me button{width:100%}
.mn{flex:1;min-width:0}.top{display:none}.ov{display:none}
main{max-width:1060px;margin:0 auto;padding:22px 24px 48px}
.hero{background:linear-gradient(135deg,#1f7a4d,#12503a);color:#fff;border-radius:18px;padding:22px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;margin-bottom:14px}
.hero h2{font-size:21px;margin:0 0 4px}.hero p{margin:0;opacity:.85;font-size:14px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
button.big{padding:12px 20px;border-radius:12px;font-weight:600;background:#fff;color:#14573a;border:0}
button.big.alt{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.4)}
.sg{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.sc{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center}
.sc i{font-style:normal;font-size:20px;width:44px;height:44px;border-radius:12px;background:var(--pri2);display:grid;place-items:center;flex:none}
.sc span{font-size:12px;color:var(--mut);display:block}.sc b{font-size:17px}
.cols{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.cols .card{margin:0}
.bi{margin-bottom:14px}.bi .t{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.bar{height:8px;background:var(--pri2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);border-radius:9px}
#md{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:14px;z-index:40}
#md.show{display:flex}#md .card{width:100%;max-width:540px;max-height:90vh;overflow-y:auto;margin:0}
#tst{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1f7a4d;color:#fff;padding:10px 18px;border-radius:99px;z-index:60;display:none;font-size:14px;max-width:90vw}
@media(max-width:820px){.side{position:fixed;left:0;top:0;bottom:0;height:auto;z-index:30;transform:translateX(-100%);transition:transform .2s;padding-top:calc(16px + env(safe-area-inset-top,0px))}.side.open{transform:none}.ov.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25}.top{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:10}main{padding:16px 14px 40px}.hero{padding:18px}}
@media print{.side,.top{display:none}}
.svc{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.svb{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 10px;border-radius:14px;background:var(--bg);border:1px solid var(--bd);font-weight:600;text-align:center}
.svb i{font-style:normal;font-size:28px;width:56px;height:56px;display:grid;place-items:center;border-radius:16px;background:var(--pri2)}.svb:hover{border-color:var(--pri)}
.credit{text-align:center;padding:14px 12px 22px;font-size:12px;color:var(--mut,#6b7280);opacity:.85}.credit b{font-weight:600}@media print{.credit{display:none}}
/* ===== Efek hidup & responsif ===== */
@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes sh{0%{background-position:-200px 0}100%{background-position:200px 0}}
@keyframes sp{to{transform:rotate(360deg)}}
.go>*{animation:fu .38s cubic-bezier(.2,.7,.2,1) both}
.go>*:nth-child(2){animation-delay:.05s}.go>*:nth-child(3){animation-delay:.1s}.go>*:nth-child(4){animation-delay:.15s}.go>*:nth-child(n+5){animation-delay:.2s}
.sg .sc,.svc .svb,.cols .card{transition:transform .18s,box-shadow .18s,border-color .18s}
.sg .sc:hover,.svc .svb:hover,.cols .card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(20,60,40,.12)}
button{transition:transform .12s,background .15s,box-shadow .15s,opacity .15s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:hover:not(.on):not(.p){background:var(--pri2)}button.p:hover,button.on:hover{filter:brightness(1.08)}
button:active{transform:scale(.95)}
button.busy{pointer-events:none;opacity:.7;position:relative}
button.busy::after{content:"";display:inline-block;width:12px;height:12px;margin-left:8px;vertical-align:-2px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .6s linear infinite}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri2)}
.bar i{transition:width .8s cubic-bezier(.2,.7,.2,1)}
tbody tr,table tr{transition:background .15s}table tr:hover td{background:var(--pri2)}
th{position:sticky;top:0;background:var(--card)}
.hero{background-size:200% 200%;animation:fu .4s both,gm 12s ease infinite}
@keyframes gm{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
#md.show{animation:fi .2s both}#md.show .card{animation:pop .22s both}#lg:not(.hide) .card{animation:pop .3s both}
@keyframes fi{from{opacity:0}to{opacity:1}}
#tst{animation:fu .25s both;box-shadow:0 6px 18px rgba(0,0,0,.25)}
#sync{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:70;background:var(--card);color:var(--pri);border:1px solid var(--bd);border-radius:99px;padding:5px 12px;font-size:12px;font-weight:600;display:none;box-shadow:0 4px 14px rgba(0,0,0,.15)}
#sync.on{display:block;animation:pop .2s both}
#sync::before{content:"";display:inline-block;width:10px;height:10px;margin-right:6px;border:2px solid var(--pri);border-right-color:transparent;border-radius:50%;animation:sp .6s linear infinite}
#sync.off{color:var(--red)}#sync.off::before{display:none}
@media(max-width:820px){
 input,select,textarea{font-size:16px;min-height:44px}button{min-height:40px}
 .cols{grid-template-columns:1fr}.sg{grid-template-columns:repeat(2,1fr)}.svc{grid-template-columns:repeat(2,1fr)}
 .hero h2{font-size:18px}.acts{width:100%}.acts button{flex:1}
 .card{padding:14px}th,td{padding:8px 8px}
 #tst{bottom:calc(20px + env(safe-area-inset-bottom,0px));width:max-content}
}
@media(max-width:380px){.sg,.svc{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.svb.dis{opacity:.5}.svb.big{padding:24px 10px;font-size:15px}

/* ===== Kasir penuh ===== */
.ks{display:flex;flex-direction:column;gap:14px;min-height:calc(100vh - 110px)}
.ksh{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.ksh h2{margin:0;font-size:22px}.ksh p{margin:2px 0 0;color:var(--mut);font-size:13px}
.kst{display:inline-flex;align-items:center;gap:8px;background:var(--pri2);color:var(--pri);padding:7px 14px;border-radius:99px;font-weight:600;font-size:13px}
.kg{flex:1;display:grid;gap:16px;grid-template-columns:1fr 1fr}
.kb{position:relative;overflow:hidden;border:0;border-radius:24px;padding:28px;color:#fff;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:18px;min-height:340px;box-shadow:0 12px 30px rgba(20,60,40,.22);transition:transform .2s,box-shadow .2s,filter .2s}
.kb:hover:not(.on):not(.p){background:none}
.kb.a{background:linear-gradient(145deg,#2bb673 0%,#1f7a4d 55%,#12503a 100%)}
.kb.b{background:linear-gradient(145deg,#2f9fd8 0%,#1b6fb3 55%,#0f4a7c 100%)}
.kb:hover{transform:translateY(-4px);box-shadow:0 18px 38px rgba(20,60,40,.3);filter:brightness(1.05)}
.kb:active{transform:scale(.98)}
.kb::before,.kb::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.1);pointer-events:none}
.kb::before{width:260px;height:260px;right:-70px;top:-80px}.kb::after{width:170px;height:170px;right:40px;bottom:-90px;background:rgba(255,255,255,.08)}
.kb .ic{font-size:64px;line-height:1;width:112px;height:112px;border-radius:30px;background:rgba(255,255,255,.18);display:grid;place-items:center;border:1px solid rgba(255,255,255,.3);animation:fl 3.2s ease-in-out infinite}
.kb.b .ic{animation-delay:.6s}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.kb h3{margin:0;font-size:30px;line-height:1.15;position:relative}.kb p{margin:6px 0 0;opacity:.88;font-size:15px;position:relative;max-width:30ch}
.kb .go2{align-self:flex-start;background:#fff;color:#14573a;padding:10px 18px;border-radius:99px;font-weight:700;font-size:14px;position:relative}
.kb.b .go2{color:#0f4a7c}
.kb.dis{opacity:.55;filter:grayscale(.3)}
@media(max-width:820px){.kg{grid-template-columns:1fr}.kb{min-height:230px;padding:22px}.kb .ic{width:84px;height:84px;font-size:46px;border-radius:24px}.kb h3{font-size:24px}.ks{min-height:0}}
</style>
</head>

async function addGuru(){
  var n=$('g_n').value.trim(),e=$('g_e').value.trim().toLowerCase(),p=$('g_p').value,r=$('g_r').value;
  if(!n)return amsg('Nama wajib diisi.',1);

  if(!/^\S+@\S+\.\S+$/.test(e))return amsg('Email tidak valid.',1);

    if(x.code==='auth/email-already-in-use'){try{nu=(await sa.signInWithEmailAndPassword(e,p)).user.uid}catch(y){return amsg('Email ini sudah punya akun Firebase dengan password lain. Pakai password lama akun itu, atau hapus akunnya di Firebase Console > Authentication.',1)}}

async function saveNama(){
  var n=$('pf_n').value.trim();
  if(!n)return pmsg('pm1','Nama wajib diisi.',1);
  if(n.indexOf('@')>=0)return pmsg('pm1','Nama tidak boleh memakai tanda @.',1);
  try{
    var uu=auth.currentUser;if(!uu)throw new Error('Sesi habis, silakan login ulang.');
    var ex=await fs.collection('username_guru').doc(unKey(n)).get();
    if(ex.exists&&ex.data().uid!==uu.uid)return pmsg('pm1','Nama sudah dipakai guru lain.',1);
    await fs.collection('profil_guru').doc(uu.uid).update({nama:n});
    await fs.collection('username_guru').doc(unKey(n)).set({email:uu.email,uid:uu.uid});
    if(unKey(who)!==unKey(n))await fs.collection('username_guru').doc(unKey(who)).delete().catch(function(){});
  }catch(x){return pmsg('pm1',esc(errm(x)),1)}
  who=n;render();toast('Nama diperbarui. Username login sekarang: '+n)}
async function savePw(){
  var o=$('pw_o').value,n=$('pw_n').value,r=$('pw_r').value;
  if(!o)return pmsg('pm2','Password lama wajib diisi.',1);
  if(n.length<6)return pmsg('pm2','Password baru minimal 6 karakter.',1);
  if(n!==r)return pmsg('pm2','Ulangi password tidak sama.',1);
  var uu=auth.currentUser;if(!uu)return pmsg('pm2','Sesi habis, silakan login ulang.',1);
  try{await uu.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(gemail,o))}catch(x){return pmsg('pm2','Password lama salah.',1)}
  try{await uu.updatePassword(n)}catch(x){return pmsg('pm2',esc(errm(x)),1)}
  ['pw_o','pw_n','pw_r'].forEach(function(i){$(i).value=''});
  pmsg('pm2','Password berhasil diganti.')}

function parseCsv(t){return t.replace(/^\ufeff/,'').split(/\r?\n/).map(function(l){return l.split(/[;,\t]/).map(function(c){return c.replace(/^"|"$/g,'').trim()})})}
function doImport(){
  var k=$('i_k').value,f=$('i_f').files[0],o=$('i_o').value,n=$('i_n').value.trim();
  if(!k)return amsg('Pilih kelas tujuan terlebih dahulu.',1);

  if(k!=='*')lk=k;var by=o+(n?' - '+n:''),rd=new FileReader(),csv=/\.csv$/i.test(f.name);
  if(!csv&&!window.XLSX)return amsg('Pembaca Excel belum termuat (perlu internet). Simpan file sebagai CSV lalu import ulang.',1);
  rd.onerror=function(){amsg('File tidak dapat dibaca.',1)};
  rd.onload=function(){var rows;try{rows=csv?parseCsv(rd.result):XLSX.utils.sheet_to_json(XLSX.read(rd.result,{type:'array'}).Sheets[XLSX.read(rd.result,{type:'array'}).SheetNames[0]],{header:1,defval:''})}catch(e){return amsg('File tidak valid atau rusak.',1)}finImp(rows,k,by,f.name)};
  if(csv)rd.readAsText(f);else rd.readAsArrayBuffer(f);

function finImp(rows,k,by,fn){
  if(k==='*')return finAll(rows,by,fn);
  var ci=-1,s0=0,i,names=[];
  for(i=0;i<Math.min(rows.length,10);i++){var j=rows[i].findIndex(function(c){return /nama/i.test(String(c))});if(j>=0){ci=j;s0=i+1;break}}
  if(ci<0)ci=(rows[0]&&rows[0].length>1)?1:0;
  for(i=s0;i<rows.length;i++){var nm=String(rows[i][ci]==null?'':rows[i][ci]).trim();if(!nm||/^contoh/i.test(nm)||/^\d+$/.test(nm))continue;names.push(nm)}
  if(!names.length)return amsg('Tidak ada nama siswa ditemukan. Pastikan nama diisi di kolom Nama Siswa.',1);
  var r=addNames(names,k);db.imp.push({ts:Date.now(),tgl:today(),kelas:k,oleh:by,jml:r[0],file:fn});save();
  amsg('Import selesai: '+r[0]+' siswa ditambahkan ke kelas '+esc(k)+' oleh '+esc(by)+(r[1]?'. '+r[1]+' nama sudah ada dan dilewati.':'.'),0,1)}

function nextKelas(k){
  if(/\bXII\b/i.test(k)||/\b12\b/.test(k))return 'LULUS';
  if(/\bXI\b/i.test(k))return k.replace(/\bXI\b/i,'XII');
  if(/\bX\b/i.test(k))return k.replace(/\bX\b/i,'XI');
  if(/\b11\b/.test(k))return k.replace(/\b11\b/,'12');
  if(/\b10\b/.test(k))return k.replace(/\b10\b/,'11');
  return ''}

function arsipLulus(g){
  if(!window.XLSX)return false;var ids={};g.forEach(function(x){ids[x.id]=1});
  var a=[['Nama','Kelas','No. Rekening']].concat(g.map(function(x){return[x.nama,x.kelas,(rekOf(x.id)||{}).no||'']}));
  var b=[['Tanggal','Nama','Kelas','Jenis','Jumlah','Keterangan','Petugas']].concat(db.trx.filter(function(t){return ids[t.sid]}).map(function(t){var x=sis(t.sid);return[t.tgl,x?x.nama:'',x?x.kelas:'',JN[t.jenis]||t.jenis,t.jml,t.ket,t.pet]}));
  var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(a),'Siswa Lulus');XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(b),'Transaksi');
  XLSX.writeFile(wb,'arsip-lulus-'+today()+'.xlsx');return true}
async function doNaik(){

  var ch=Object.keys(map);if(!ch.length)return er('Belum ada kelas yang diubah.');
  var grad=db.siswa.filter(function(x){return map[x.kelas]===null}),tot=0,nb=grad.filter(function(x){return saldo(x.id)>0}).length;
  if(tot>0&&!$('nk_ok').checked)return er('Siswa lulus masih punya saldo '+rp(tot)+' ('+nb+' siswa). Kembalikan saldonya lalu centang konfirmasi.');

  if(!confirm('Proses kenaikan kelas?\n\n- '+mv+' siswa naik/pindah kelas\n- '+grad.length+' siswa lulus (DIHAPUS beserta riwayat transaksinya)\n\nTindakan ini tidak bisa dibatalkan.'))return;
  if(grad.length&&!arsipLulus(grad)&&!confirm('Arsip Excel gagal dibuat (pembaca Excel belum termuat). Lanjutkan tanpa arsip?'))return;
  var moved=[],gid={};grad.forEach(function(x){gid[x.id]=1});
  db.siswa.forEach(function(x){var t=map[x.kelas];if(t)moved.push(x),x.kelas=t});
  db.siswa=db.siswa.filter(function(x){return !gid[x.id]});db.trx=db.trx.filter(function(t){return !gid[t.sid]});db.rek=db.rek.filter(function(r){return !gid[r.sid]});
  db.kelas=db.kelas.filter(function(k){return !(k in map)});
  ch.forEach(function(k){if(map[k]&&kelasList().indexOf(map[k])<0)db.kelas.push(map[k]);delete db.wali[k]});
  var rpt=db.ptg&&(db.ptg.kelas in map);if(rpt)db.ptg=null;
  closeModal();toast('Memproses kenaikan kelas...');
  try{
    await pq;
    var nn=kelasNames().filter(function(k){return !snap.kelas[k]}),iso=new Date().toISOString();
    nn.forEach(function(k){kid[k]=uid()});
    await wr(nn.map(function(k){return{t:'kelas',id:kid[k],d:{nama:k,dibuat_pada:iso}}}).concat(moved.map(function(x){return{t:'siswa',id:x.id,upd:1,d:{kelas_id:kid[x.kelas]}}})));

    if(rpt)await fs.collection('pengaturan').doc('petugas').set({nilai:null});
    save();
    lk='';sf='';amsg('Kenaikan kelas selesai: '+moved.length+' siswa naik kelas, '+grad.length+' siswa lulus dihapus. Impor siswa baru kelas X lewat Import dari Excel.',0,1)
  }catch(e){toast('Gagal memproses: '+(e.message||e));try{await loadAll();render()}catch(x){}}}

var rk={tgl:'',pet:null};
function jam(ts){return isFinite(ts)?new Date(ts).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}):'-'}
function rkData(){
  if(!rk.tgl)rk.tgl=today();var pf=rk.pet===null?(pgs||'*'):rk.pet,pets={};
  db.trx.concat(db.jual).forEach(function(x){if(x.tgl===rk.tgl&&x.pet)pets[x.pet]=1});
  var ok2=function(x){return x.tgl===rk.tgl&&(pf==='*'||x.pet===pf)};
  var T=db.trx.filter(ok2).sort(function(a,b){return a.ts-b.ts}),J=db.jual.filter(ok2).sort(function(a,b){return a.ts-b.ts});
  var t={setor:0,tarik:0,masuk:0,keluar:0},jg={jual:[0,0],bayar:[0,0],digital:[0,0]},jt=0;
  T.forEach(function(x){t[x.jenis]+=x.jml});
  J.forEach(function(x){var v=x.nom+x.fee-(x.dsk||0);if(jg[x.g]){jg[x.g][0]++;jg[x.g][1]+=v}jt+=v});
  var masuk=t.setor+t.masuk+jt,keluar=t.tarik+t.keluar;
  return{rb:db.rek.filter(function(r){return r.tgl===rk.tgl&&(pf==='*'||r.pet===pf)}).length,pf:pf,pets:Object.keys(pets).sort(),T:T,J:J,t:t,jg:jg,jt:jt,masuk:masuk,keluar:keluar}}

  var ad=0,n=0;db.rek.forEach(function(x){if(x.jns==='baru'&&x.adm>0){ad+=x.adm;n++}});return{rek:r-ad,cash:c,adm:ad,n:n}}
function kasRows(){
  var a=db.kas.map(function(e){return{id:e.id,tgl:e.tgl,ts:e.ts,kas:e.kas,jenis:e.jenis,jml:e.jml,ket:e.ket,pet:e.pet}});
  db.rek.forEach(function(r){if(r.jns==='baru'&&r.adm>0){var z=sis(r.sid);a.push({tgl:r.tgl,ts:r.ts,kas:'rekening',jenis:'keluar',jml:r.adm,ket:'Biaya admin rekening baru'+(z?' - '+z.nama+' ('+z.kelas+')':''),pet:r.pet,auto:1})}});

async function saveKas(m){
  var tg=$('k_t').value,jml=numv('k_j'),ket=$('k_k').value.trim();
  if(!tg)return note('Tanggal wajib diisi.',1);
  if(jml<1)return note('Jumlah harus lebih dari 0.',1);
  if(!ket)return note('Keterangan wajib diisi.',1);
  var g=uid(),ts=Date.now(),b={tgl:tg,jml:jml,pet:who,grp:g},es=[];
  if(m==='pindah'){var c2r=$('k_a').value==='c2r',fr=c2r?'cash':'rekening',to=c2r?'rekening':'cash';
    es.push(Object.assign({id:uid(),ts:ts,kas:fr,jenis:'keluar',ket:'Pindah ke kas '+to+': '+ket},b));
    es.push(Object.assign({id:uid(),ts:ts+1,kas:to,jenis:'masuk',ket:'Pindah dari kas '+fr+': '+ket},b))}
  else es.push(Object.assign({id:uid(),ts:ts,kas:$('k_s').value,jenis:m==='tambah'?'masuk':'keluar',ket:ket},b));
  try{await wr(es.map(function(e){return{t:'pengaturan',id:'kas_'+e.id,d:{nilai:e}}}))}catch(x){return note(esc(errm(x)),1)}
  es.forEach(function(e){db.kas.push(e)});closeModal();toast('Kas tersimpan: '+rp(jml));render()}
async function delKas(id){
  var e=db.kas.find(function(x){return x.id===id});if(!e||!confirm('Hapus catatan kas ini?'+(db.kas.some(function(x){return x.grp===e.grp&&x.id!==id})?' Pasangan pemindahannya ikut dihapus.':'')))return;
  var del=db.kas.filter(function(x){return x.id===id||(e.grp&&x.grp===e.grp)});
  try{await wr(del.map(function(x){return{t:'pengaturan',id:'kas_'+x.id,del:1}}))}catch(x){return toast(errm(x))}
  db.kas=db.kas.filter(function(x){return del.indexOf(x)<0});toast('Catatan kas dihapus');render()}

async function saveRek(id){
  function er(m){$('em').innerHTML='<div class="msg e">'+m+'</div>'}
  var r=db.rek.find(function(x){return x.id===id});if(!r)return;
  var st=$('e_st').value,no=$('e_n').value.replace(/[\s-]/g,''),tg=$('e_t').value;
  if(!tg)return er('Tanggal wajib diisi.');
  if(st==='terbit'){if(!/^\d{8,16}$/.test(no))return er('Isi nomor rekening (angka 8-16 digit).');if(db.rek.some(function(x){return x.id!==id&&x.no===no}))return er('Nomor rekening ini sudah terdaftar untuk siswa lain.')}else no='';
  try{await fs.collection('rekening').doc(id).set({no_rekening:no,status:st,tanggal:tg},{merge:true})}catch(x){return er(esc(errm(x)))}
  r.no=no;r.st=st;r.tgl=tg;closeModal();toast(st==='terbit'?'Rekening ditandai sudah terbit':'Rekening disimpan (belum terbit)');render()}
function delRek(id){var r=db.rek.find(function(x){return x.id===id});if(!r||!confirm('Hapus rekening '+r.no+'?'))return;db.rek=db.rek.filter(function(x){return x.id!==id});save();render()}
async function saveKom(){var n=numv('kom_n');if(n<0)return amsg('Nilai tidak boleh negatif.',1);
  try{await fs.collection('pengaturan').doc('komisi').set({nilai:n})}catch(x){return amsg(esc(errm(x)),1)}
  db.kom=n;amsg('Komisi per rekening disimpan.',0,1)}
function rekList(){return db.rek.filter(function(r){return(!rf.m||String(r.tgl).slice(0,7)===rf.m)&&(!rf.j||r.jns===rf.j)&&(!rf.s||r.st===rf.s)}).sort(function(a,b){return String(b.tgl).localeCompare(String(a.tgl))||b.ts-a.ts})}
function vRekening(){
  var l=rekList(),nb=l.filter(function(r){return r.jns==='baru'}).length,nt=l.filter(function(r){return r.jns==='baru'&&r.st==='terbit'}).length,bt=db.rek.filter(function(r){return r.st!=='terbit'}).length,nbAll=db.rek.filter(function(r){return r.jns==='baru'}).length,blm=db.siswa.filter(function(x){return !rekOf(x.id)}).length;
  return '<div class="sg">'+sc('🏦','Total Rekening',db.rek.length)+sc('🆕','Rekening Baru'+(rf.m?' ('+rf.m+')':''),nb)+sc('💵','Komisi'+(rf.m?' Bulan Ini':' Total'),rp(nt*db.kom))+sc('⏳','Belum Punya Rekening',blm)+sc('📝','Belum Terbit',bt)+'</div>'+
  '<div class="card" style="margin-top:14px"><h2>Rekening BNI Siswa</h2><div class="grid2"><div><label>Bulan</label><input type="month" value="'+esc(rf.m)+'" onchange="rf.m=this.value;render()"></div><div><label>Jenis</label><select onchange="rf.j=this.value;render()"><option value="">Semua</option><option value="baru"'+(rf.j==='baru'?' selected':'')+'>Baru</option><option value="lama"'+(rf.j==='lama'?' selected':'')+'>Lama (manual)</option></select></div><div><label>Status</label><select onchange="rf.s=this.value;render()"><option value="">Semua</option><option value="terbit"'+(rf.s==='terbit'?' selected':'')+'>Sudah terbit</option><option value="belum"'+(rf.s==='belum'?' selected':'')+'>Belum terbit</option></select></div><div><label>Komisi per rekening baru (Rp)</label><input id="kom_n" inputmode="numeric" autocomplete="off" oninput="fmtIn(this)" value="'+fmtN(db.kom)+'"></div></div><br>'+
  '<button class="p" onclick="saveKom()">Simpan Komisi</button> <button onclick="openRek(\'baru\')">＋ Buka Rekening Baru</button> <button onclick="openRek(\'lama\')">＋ Tambah Rekening Lama (Manual)</button> <button onclick="rekXls()">Unduh Excel</button><div id="am">'+msg+'</div></div>'+
  '<div class="card"><h2>Daftar Rekening ('+l.length+')</h2>'+(l.length?'<div class="tw"><table><tr><th>Tanggal</th><th>Nama</th><th>Kelas</th><th>No. Rekening</th><th>Jenis</th><th>Status</th><th>Petugas</th><th></th></tr>'+l.map(function(r){var z=sis(r.sid);return '<tr><td>'+esc(r.tgl)+'</td><td>'+(z?esc(z.nama):'-')+'</td><td>'+(z?esc(z.kelas):'-')+'</td><td>'+esc(r.st==='terbit'?r.no:'-')+'</td><td>'+(r.jns==='baru'?'<b class="in">Baru</b>':'Lama')+'</td><td>'+(r.st==='terbit'?'<b class="in">Sudah terbit</b>':'<b style="color:var(--amb)">Belum terbit</b>')+'</td><td>'+esc(r.pet)+'</td><td><button onclick="editRek(\''+r.id+'\')">Edit</button> <button class="d" onclick="delRek(\''+r.id+'\')">Hapus</button></td></tr>'}).join('')+'</table></div>':'<p class="mut">Belum ada rekening.</p>')+'</div>'}
function rekXls(){if(!window.XLSX)return toast('Pembaca Excel belum termuat (perlu internet).');
  var rows=[['Tanggal','Nama','Kelas','No. Rekening','Jenis','Status','Petugas']].concat(rekList().map(function(r){var z=sis(r.sid);return[r.tgl,z?z.nama:'',z?z.kelas:'',r.st==='terbit'?r.no:'',r.jns==='baru'?'Baru':'Lama',r.st==='terbit'?'Sudah terbit':'Belum terbit',r.pet]}));
  var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'Rekening');XLSX.writeFile(wb,'rekening-bni'+(rf.m?'-'+rf.m:'')+'.xlsx')}
function eselAll(id,sel){return '<select id="'+id+'"><option value="">Pilih kelas</option><option value="*"'+(sel==='*'?' selected':'')+'>⭐ Semua kelas (dari kolom Kelas di Excel)</option>'+opts(kelasList(),sel)+'</select>'}
function finAll(rows,by,fn){
  var hi=-1,cn=-1,ck=-1,cw=-1,i;
  for(i=0;i<Math.min(rows.length,10);i++){var h=rows[i].map(function(c){return String(c).trim().toLowerCase()});
    var a=h.findIndex(function(c){return /nama/.test(c)&&!/wali/.test(c)}),b=h.findIndex(function(c){return /kelas/.test(c)&&!/wali/.test(c)});
    if(a>=0&&b>=0){hi=i;cn=a;ck=b;cw=h.findIndex(function(c){return /wali/.test(c)});break}}
  if(hi<0)return amsg('Kolom tidak ditemukan. Gunakan template Semua Kelas: No, Nama Siswa, Kelas, Wali Kelas.',1);
  var g={},order=[],skip=0,wl={};
  function cell(r,c){return c<0||r[c]==null?'':String(r[c]).replace(/\s+/g,' ').trim()}
  for(i=hi+1;i<rows.length;i++){var r=rows[i],nm=cell(r,cn),kl=cell(r,ck),w=cell(r,cw);
    if(!nm||/^contoh/i.test(nm)||/^\d+$/.test(nm))continue;
    if(!kl){skip++;continue}
    var ex=kelasList().concat(order).find(function(x){return x.toLowerCase()===kl.toLowerCase()});kl=ex||kl;
    if(!g[kl]){g[kl]=[];order.push(kl)}g[kl].push(nm);if(w)wl[kl]=w}
  if(!order.length)return amsg('Tidak ada data siswa yang valid. Pastikan kolom Nama Siswa dan Kelas terisi.',1);
  var n=0,d=0,wch=false;
  order.forEach(function(k){var r=addNames(g[k],k);n+=r[0];d+=r[1];if(r[0])db.imp.push({ts:Date.now()+n,tgl:today(),kelas:k,oleh:by,jml:r[0],file:fn});
    if(wl[k]){if(kelasList().indexOf(k)<0)db.kelas.push(k);if(db.wali[k]!==wl[k]){db.wali[k]=wl[k];wch=true}}});
  save();
  if(wch)fs.collection('pengaturan').doc('wali').set({nilai:db.wali}).catch(function(e){toast('Wali kelas gagal disimpan: '+(e.message||e))});
  amsg('Import selesai: '+n+' siswa ditambahkan ke '+order.length+' kelas oleh '+esc(by)+(d?'. '+d+' nama sudah ada dan dilewati':'')+(skip?'. '+skip+' baris tanpa kelas diabaikan':'')+'.',0,1)}
function tplDl(all){
  var rows=all?[['No','Nama Siswa','Kelas','Wali Kelas'],[1,'Contoh: Budi Santoso (hapus baris ini)','X TKJ 1','Bu Ani'],[2,'Contoh: Siti Aminah (hapus baris ini)','X TKJ 1','Bu Ani'],[3,'Contoh: Andi Pratama (hapus baris ini)','XI AKL 2','Pak Budi']]:[['No','Nama Siswa'],[1,'Contoh: Budi Santoso (hapus baris ini)']],fnm=all?'template-semua-kelas.xlsx':'template-data-siswa.xlsx';
  if(window.XLSX){var ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=all?[{wch:6},{wch:42},{wch:14},{wch:20}]:[{wch:6},{wch:42}];var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Data Siswa');
    if(all){var kl=[['Kelas yang sudah ada','Wali Kelas']].concat(kelasList().map(function(k){return[k,db.wali[k]||'']}));var w2=XLSX.utils.aoa_to_sheet(kl);w2['!cols']=[{wch:22},{wch:20}];XLSX.utils.book_append_sheet(wb,w2,'Daftar Kelas')}
    XLSX.writeFile(wb,fnm)}
  else{var a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(function(r){return r.join(',')}).join('\n')],{type:'text/csv'}));a.download=fnm.replace('.xlsx','.csv');a.click()}}

function delSiswa(id){var s=sis(id);if(!confirm('Hapus '+s.nama+'? Riwayat transaksi siswa ini juga ikut dihapus.'))return;db.siswa=db.siswa.filter(function(x){return x.id!==id});db.trx=db.trx.filter(function(t){return t.sid!==id});db.rek=db.rek.filter(function(r){return r.sid!==id});save();render()}
function vLaporan(){var l=filt(),m=0,k=0;l.forEach(function(t){if(t.jenis==='setor'||t.jenis==='masuk')m+=t.jml;else k+=t.jml});
  return '<div class="card"><h2>Laporan</h2>'+fbar()+'<br><div class="grid"><div class="stat"><span>Total Masuk</span><b>'+rp(m)+'</b></div><div class="stat"><span>Total Keluar</span><b>'+rp(k)+'</b></div><div class="stat"><span>Selisih</span><b>'+rp(m-k)+'</b></div></div><br><button class="p" onclick="csv()">Unduh CSV</button> <button onclick="window.print()">Cetak</button><br><br>'+tbl(l,false)+'</div>'}
function csv(){var rows=[['Tanggal','Jenis','Siswa','Kelas','Kategori','Keterangan','Jumlah','Petugas']].concat(filt().map(function(t){var s=sis(t.sid);return [t.tgl,JN[t.jenis],s?s.nama:'',s?s.kelas:'',t.kat,t.ket,t.jml,t.pet]}));
  var c=rows.map(function(r){return r.map(function(x){return '"'+String(x).replace(/"/g,'""')+'"'}).join(',')}).join('\n');
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+c],{type:'text/csv'}));a.download='laporan-koperasi.csv';a.click()}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal()});
$('v').innerHTML='<p class="mut">Memuat data...</p>';
boot();

    (function f(now){var k=Math.min(1,(now-t0)/d),e=1-Math.pow(1-k,3);el.textContent=pre+Math.round(n*e).toLocaleString('id-ID');if(k<1)requestAnimationFrame(f)})(t0)}

  document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('button.p');if(b){b.classList.add('busy');setTimeout(function(){b.classList.remove('busy')},700)}},true);

})();
